run_id: libero_qwenoft_ascend
run_root_dir: /home/hfang/output/VLA_Ascend
seed: 42
trackers: [jsonl, wandb]
wandb_entity: heng_
wandb_project: VLA_Ascend
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  history_flow_stage: stage1
  qwenvl:
    base_vlm: /home/hfang/public_datasets/starVLA/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
    model_dtype: bfloat16
    linearize_vision_patch_embed: true
    vl_hidden_dim: 2560
  action_model:
    action_model_type: MLP
    action_hidden_dim: 2560
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
  world_model:
    enabled: false

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    data_root_dir: /home/hfang/public_datasets/starVLA/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    video_backend: torchvision_av
    video_backend_kwargs:
      num_threads: 1
    video_gc_collect: false
    include_state: false
    history_mode: frame

trainer:
  epochs: 100
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  non_finite_check_interval: 1
  non_finite_check_warmup_steps: 0

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
